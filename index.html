<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launch Lab 21 — Инкубатор</title>
<style>
  :root {
    --bg: #141925;
    --surface: #1e2433;
    --surface-2: #262d3f;
    --line: #2f3749;
    --ink: #eef0f5;
    --muted: #9aa3b5;
    --violet: #8b3cf7;
    --violet-soft: rgba(139, 60, 247, .16);
    --green: #3ee89a;
    --green-soft: rgba(62, 232, 154, .13);
    --amber: #f5b544;
    --amber-soft: rgba(245, 181, 68, .14);
    --red: #ff6b6b;
    --brand: linear-gradient(90deg, #8b3cf7, #3ee89a);
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--ink);
    font: 17px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(1100px 560px at 8% -12%, rgba(139, 60, 247, .20), transparent 60%),
      radial-gradient(900px 480px at 108% 4%, rgba(62, 232, 154, .10), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    min-height: 100vh;
  }
  a { color: inherit; }
  h1 { font-size: 34px; line-height: 1.15; margin: 0 0 6px; letter-spacing: -.01em; }
  h2 { font-size: 21px; line-height: 1.25; margin: 0 0 4px; }
  h3 { font-size: 19px; margin: 0; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .eyebrow {
    display: inline-block; font-size: 14px; font-weight: 700; letter-spacing: .06em;
    text-transform: uppercase; color: #b89cff; margin-bottom: 6px;
  }
  .grad { background: var(--brand); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .missing { color: var(--muted); font-style: italic; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .spacer { flex: 1; }
  .stack > * + * { margin-top: 12px; }

  /* ---------- Шапка ---------- */
  header.top {
    background: rgba(12, 15, 23, .82); border-bottom: 1px solid var(--line);
    padding: 12px 28px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  }
  header.top .brand { font-weight: 800; font-size: 19px; letter-spacing: .01em; text-decoration: none; }
  header.top .crumbs { color: var(--muted); font-size: 15px; }
  header.top .crumbs a { color: var(--ink); text-decoration: none; }
  header.top .crumbs a:hover { text-decoration: underline; }
  .role-switch { display: flex; align-items: center; gap: 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
  .role-switch .role-label { font-size: 14px; color: var(--muted); padding: 0 6px 0 8px; }
  .role-switch button {
    font: inherit; font-size: 15px; font-weight: 700; color: var(--muted);
    background: transparent; border: 0; padding: 7px 14px; border-radius: 9px; cursor: pointer;
  }
  .role-switch button:hover { color: var(--ink); }
  .role-switch button[aria-pressed="true"] { background: var(--brand); color: #0d1020; }

  main { max-width: 1220px; margin: 0 auto; padding: 32px 28px 72px; }
  #app > * { animation: rise .24s ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* ---------- Базовые компоненты ---------- */
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 22px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .18);
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    font: inherit; font-weight: 700; font-size: 16px;
    padding: 11px 18px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
    text-decoration: none; white-space: nowrap; transition: border-color .15s, filter .15s, transform .1s;
  }
  .btn:hover { border-color: #4a5470; }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--brand); color: #0d1020; border-color: transparent; box-shadow: 0 6px 20px rgba(139, 60, 247, .28); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.ghost { background: transparent; }
  .btn.small { padding: 7px 13px; font-size: 15px; }
  .btn.block { width: 100%; }
  .btn.danger { color: var(--red); }
  :focus-visible { outline: 3px solid var(--violet); outline-offset: 2px; }
  .badge {
    display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 700;
    padding: 3px 11px; border-radius: 99px; white-space: nowrap;
  }
  .badge.done { background: var(--green-soft); color: var(--green); }
  .badge.partial { background: var(--amber-soft); color: var(--amber); }
  .badge.empty { background: var(--surface-2); color: var(--muted); }
  .badge.current { background: var(--violet-soft); color: #c4a5ff; }
  .progress { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
  .progress > div { height: 100%; background: var(--brand); border-radius: 99px; transition: width .35s ease; }
  .notice { background: var(--violet-soft); border: 1px solid rgba(139, 60, 247, .35); color: #dccbff; border-radius: var(--radius); padding: 13px 18px; margin-bottom: 18px; }
  .success { background: var(--green-soft); border: 1px solid rgba(62, 232, 154, .35); color: #c8f7e0; border-radius: var(--radius); padding: 16px 20px; margin-bottom: 20px; }
  .form-error { color: var(--red); font-weight: 700; margin: 0; }
  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 20;
    background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); border-left: 4px solid var(--green);
    padding: 12px 20px; border-radius: 10px; font-weight: 700; box-shadow: 0 10px 30px rgba(0, 0, 0, .4);
  }

  /* ---------- Поля ---------- */
  label.field { display: block; }
  label.field .q { display: flex; align-items: baseline; gap: 10px; font-weight: 700; margin-bottom: 8px; }
  .q-num {
    flex: none; width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center;
    background: var(--violet-soft); color: #c4a5ff; font-size: 14px;
  }
  input[type=text], textarea {
    width: 100%; font: inherit; color: var(--ink);
    padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: #151a26;
    transition: border-color .15s, box-shadow .15s;
  }
  input[type=text]::placeholder, textarea::placeholder { color: #6f788b; }
  input[type=text]:focus, textarea:focus { outline: none; border-color: var(--violet); box-shadow: 0 0 0 3px rgba(139, 60, 247, .25); }
  textarea { min-height: 104px; resize: vertical; }
  textarea[readonly] { background: #1a1f2c; }

  /* ---------- Полоса сценария и шаги модулей ---------- */
  .journey { list-style: none; margin: 0 0 26px; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .journey li {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px;
    background: var(--surface); border: 1px solid var(--line);
    color: var(--muted); font-size: 15px; font-weight: 700; line-height: 1.25;
  }
  .journey .j-num { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-size: 14px; }
  .journey li.done { color: var(--green); border-color: rgba(62, 232, 154, .3); }
  .journey li.done .j-num { background: var(--green-soft); }
  .journey li.active { background: var(--brand); color: #0d1020; border-color: transparent; box-shadow: 0 6px 20px rgba(139, 60, 247, .3); }
  .journey li.active .j-num { background: rgba(255, 255, 255, .75); }
  .steps { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .step {
    font-size: 15px; font-weight: 700; text-decoration: none; color: var(--muted);
    padding: 7px 14px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line);
  }
  .step:hover { color: var(--ink); }
  .step.done { color: var(--green); border-color: rgba(62, 232, 154, .3); }
  .step.active { color: #fff; border-color: var(--violet); background: var(--violet-soft); }

  /* ---------- Старт ---------- */
  .hero { text-align: center; padding: 28px 0 8px; }
  .hero-title { font-size: clamp(38px, 6vw, 64px); line-height: 1.05; margin: 8px 0 16px; letter-spacing: -.02em; }
  .hero-sub { max-width: 680px; margin: 0 auto 34px; color: var(--muted); font-size: 19px; }
  .how { list-style: none; padding: 0; margin: 0 auto 30px; max-width: 980px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .how li { display: flex; flex-direction: column; gap: 6px; }
  .how-num { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-weight: 800; background: var(--brand); color: #0d1020; margin-bottom: 4px; }
  .how li span:last-child { color: var(--muted); font-size: 15px; }
  .roles { max-width: 980px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .role-card {
    font: inherit; color: inherit; text-align: left; cursor: pointer;
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 26px;
    display: flex; flex-direction: column; gap: 8px; position: relative; overflow: hidden;
    transition: transform .15s, border-color .15s, box-shadow .15s;
  }
  .role-card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--brand); }
  .role-card:hover { transform: translateY(-3px); border-color: var(--violet); box-shadow: 0 16px 40px rgba(139, 60, 247, .22); }
  .role-icon { font-size: 34px; line-height: 1; }
  .role-card p { margin: 0; color: var(--muted); }
  .role-cta { margin-top: 10px; font-weight: 800; color: var(--green); }
  .foot-note { text-align: center; color: var(--muted); font-size: 15px; margin-top: 28px; }

  /* ---------- Выбор проекта ---------- */
  .pick { width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; transition: border-color .15s, transform .15s; }
  .pick:hover { border-color: var(--violet); transform: translateY(-2px); }
  .create-card { border: 1px dashed rgba(139, 60, 247, .6); background: linear-gradient(135deg, rgba(139, 60, 247, .14), rgba(62, 232, 154, .06)); }

  /* ---------- Проект ---------- */
  .page-head { margin-bottom: 22px; align-items: flex-end; }
  .project-grid { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 22px; align-items: start; }
  .progress-card { text-align: center; position: sticky; top: 20px; }
  .ring { position: relative; width: 150px; height: 150px; margin: 4px auto 12px; }
  .ring svg { width: 150px; height: 150px; display: block; }
  .ring .ring-value { transition: stroke-dashoffset .6s ease; }
  .ring-label { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ring-label strong { font-size: 32px; line-height: 1; }
  .ring-label span { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .pc-caption { font-weight: 700; margin-bottom: 8px; }
  .remaining { color: var(--muted); margin: 0 0 16px; font-size: 15px; }
  .remaining strong { color: var(--ink); }
  .pc-actions { display: grid; gap: 8px; margin-top: 10px; }
  .track { list-style: none; margin: 0; padding: 0; position: relative; }
  .track::before { content: ""; position: absolute; left: 41px; top: 34px; bottom: 34px; width: 2px; background: var(--line); }
  .track li + li { margin-top: 12px; }
  .module-item { display: flex; align-items: center; gap: 16px; text-decoration: none; position: relative; transition: border-color .15s, transform .15s; }
  .module-item:hover { border-color: #4a5470; transform: translateX(3px); }
  .module-item.is-current { border-color: var(--violet); box-shadow: 0 0 0 1px var(--violet), 0 12px 34px rgba(139, 60, 247, .25); }
  .node {
    flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
    font-weight: 800; background: var(--surface-2); color: var(--muted); border: 2px solid var(--line); position: relative; z-index: 1;
  }
  .node.done { background: var(--green); color: #0d1020; border-color: var(--green); }
  .node.current { background: var(--violet); color: #fff; border-color: #b89cff; box-shadow: 0 0 0 6px rgba(139, 60, 247, .22); }
  .node.partial { border-color: var(--amber); color: var(--amber); }
  .mi-body { flex: 1; min-width: 0; }
  .mi-title { font-weight: 800; font-size: 18px; }
  .mi-desc { color: var(--muted); font-size: 15px; }
  .mi-badges { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

  /* ---------- Модуль: форма + живое превью ---------- */
  .split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; align-items: start; }
  .form-card { padding: 26px 26px 0; }
  .form-head h1 { font-size: 32px; }
  .filled { display: flex; align-items: center; gap: 12px; margin: -8px 0 22px; }
  .filled .progress { flex: 1; }
  .filled span { font-size: 14px; font-weight: 700; color: var(--muted); white-space: nowrap; }
  .fields > * + * { margin-top: 20px; }
  .form-actions {
    position: sticky; bottom: 0; z-index: 2; margin: 22px -26px 0; padding: 16px 26px;
    background: rgba(30, 36, 51, .96); border-top: 1px solid var(--line); border-radius: 0 0 var(--radius) var(--radius);
  }
  .form-actions .form-error { margin-top: 10px; }
  .preview {
    position: sticky; top: 20px; max-height: calc(100vh - 40px); overflow: auto;
    background: rgba(12, 15, 23, .55); border: 1px solid var(--line); border-radius: 18px; padding: 16px;
  }
  .preview-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
  .preview-title { font-weight: 800; }
  .preview-hint { color: var(--muted); font-size: 14px; margin: 0 0 12px; }

  /* ---------- One-pager (светлый лист) ---------- */
  .sheet {
    --s-ink: #1b1d22; --s-muted: #6b6f78; --s-line: #e7e4dc;
    background: #fff; color: var(--s-ink); border-radius: 16px; padding: 44px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .35);
  }
  .sheet .missing { color: var(--s-muted); }
  .op-head { border-bottom: 2px solid var(--s-ink); padding-bottom: 22px; margin-bottom: 18px; }
  .op-label { text-transform: uppercase; letter-spacing: .1em; font-size: 13px; font-weight: 800; color: #6d28d9; }
  .op-title { font-size: 40px; font-weight: 800; line-height: 1.1; margin: 6px 0 10px; letter-spacing: -.01em; overflow-wrap: anywhere; }
  .op-desc { font-size: 19px; margin: 0 0 12px; overflow-wrap: anywhere; }
  .op-team { color: var(--s-muted); margin: 0 0 16px; overflow-wrap: anywhere; }
  .op-ready { display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 700; color: var(--s-muted); }
  .op-ready-bar { flex: 1; max-width: 240px; height: 6px; border-radius: 99px; background: #eeebe4; overflow: hidden; }
  .op-ready-bar > div { height: 100%; background: var(--brand); }
  .op-section { padding: 16px 18px; margin: 0 -18px; border-radius: 12px; border-left: 4px solid transparent; }
  .op-section + .op-section { margin-top: 6px; }
  .op-sec-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .op-num { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: #f1ecfe; color: #6d28d9; font-weight: 800; font-size: 14px; }
  .sheet dl { margin: 12px 0 0; }
  .sheet dt { font-weight: 700; color: var(--s-muted); font-size: 14px; }
  .sheet dd { margin: 2px 0 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .sheet .badge.done { background: #e6f4ea; color: #15803d; }
  .sheet .badge.partial { background: #fdf1e1; color: #b45309; }
  .sheet .badge.current { background: #efe8fd; color: #6d28d9; }
  .empty-section {
    border: 2px dashed #d6d2c8; border-radius: 12px; padding: 18px; margin-top: 12px;
    color: var(--s-muted); background: #faf9f6;
  }
  .empty-section a { color: #6d28d9; font-weight: 700; }
  .just-saved { border-left-color: #15803d; animation: flash 1.8s ease-out; }
  @keyframes flash { from { background: #d9f2e0; } to { background: transparent; } }
  .is-drafting { background: #f6f1ff; border-left-color: #8b3cf7; }
  .sheet.is-preview { padding: 24px; border-radius: 12px; font-size: 15px; }
  .sheet.is-preview .op-title { font-size: 26px; }
  .sheet.is-preview .op-desc { font-size: 16px; }
  .sheet.is-preview h3 { font-size: 16px; }
  .sheet.is-preview dd { margin-bottom: 8px; }

  /* ---------- Комментарии ---------- */
  .comments { margin-top: 16px; background: var(--violet-soft); border: 1px solid rgba(139, 60, 247, .35); border-radius: 12px; padding: 14px 16px; }
  .comments-title { font-weight: 800; font-size: 15px; color: #c4a5ff; }
  .comment { background: var(--surface-2); border-radius: 10px; padding: 9px 13px; margin-top: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .comment-meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .comment-form { margin-top: 10px; flex-wrap: nowrap; }
  .comment-form input { flex: 1; width: auto; min-width: 0; }
  .sheet .comments { background: #f5f0ff; border-color: #e1d5fb; }
  .sheet .comments-title { color: #6d28d9; }
  .sheet .comment { background: #fff; color: var(--s-ink); }
  .sheet .comment-meta { color: var(--s-muted); }
  .sheet input[type=text] { background: #fff; color: var(--s-ink); border-color: #d9d0f3; }

  /* ---------- Куратор ---------- */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
  .stat { padding: 18px 20px; }
  .stat-num { font-size: 36px; font-weight: 800; line-height: 1.1; background: var(--brand); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .stat .sub { margin: 0; font-size: 15px; }
  .table-wrap { padding: 0; overflow-x: auto; }
  table.teams { width: 100%; border-collapse: collapse; }
  .teams th { text-align: left; font-size: 14px; color: var(--muted); font-weight: 700; padding: 14px 16px; background: var(--surface-2); white-space: nowrap; }
  .teams td { padding: 14px 16px; border-top: 1px solid var(--line); vertical-align: middle; }
  .teams tbody tr { cursor: pointer; transition: background .15s; }
  .teams tbody tr:hover { background: rgba(139, 60, 247, .08); }
  .dots { display: flex; gap: 6px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: #3a4256; }
  .dot.done { background: var(--green); }
  .dot.partial { background: var(--amber); }

  /* ---------- Адаптив, движение, печать ---------- */
  @media (max-width: 1000px) {
    .split { grid-template-columns: 1fr; }
    .preview { position: static; max-height: none; }
  }
  @media (max-width: 900px) {
    .project-grid, .roles, .how { grid-template-columns: 1fr; }
    .progress-card { position: static; }
  }
  @media (max-width: 700px) {
    main { padding: 22px 16px 60px; }
    header.top { padding: 10px 16px; }
    h1, .form-head h1 { font-size: 26px; }
    .journey, .stats { grid-template-columns: repeat(2, 1fr); }
    .sheet { padding: 24px; }
    .op-title { font-size: 28px; }
    .module-item { flex-wrap: wrap; }
    .track::before { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  @media print {
    body { background: #fff; }
    header.top, .no-print { display: none !important; }
    main { padding: 0; max-width: none; }
    #app > * { animation: none; }
    .sheet { box-shadow: none; border-radius: 0; padding: 0; }
  }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#/start">Launch Lab <span class="grad">21</span></a>
  <nav class="crumbs" id="crumbs"></nav>
  <div class="spacer"></div>
  <div class="role-switch" role="group" aria-label="Роль">
    <span class="role-label">Роль:</span>
    <button type="button" data-role="participant">Участник</button>
    <button type="button" data-role="curator">Куратор</button>
  </div>
</header>
<main id="app"></main>

<script>
/* =========================================================
   Модули программы — массив объектов.
   Чтобы добавить модуль, достаточно дописать объект сюда.
   ========================================================= */
const MODULES = [
  {
    id: 'problem',
    title: 'Проблема и аудитория',
    description: 'Сформулируйте, какую боль вы решаете и для кого.',
    fields: [
      { id: 'problem',  label: 'Какую проблему вы решаете?',
        placeholder: 'Например: студенты тратят по 3 часа в неделю на поиск свободной аудитории для учёбы' },
      { id: 'audience', label: 'Кто страдает от этой проблемы?',
        placeholder: 'Например: студенты 1–4 курсов крупных вузов, которые учатся в группах' },
      { id: 'current',  label: 'Как они справляются с этим сегодня?',
        placeholder: 'Например: ходят по корпусам, спрашивают в чатах, сидят в кафе' },
    ],
  },
  {
    id: 'solution',
    title: 'Решение и MVP',
    description: 'Опишите ваш продукт и то, что уже сделано.',
    fields: [
      { id: 'solution', label: 'Как ваш продукт решает проблему?',
        placeholder: 'Например: мобильное приложение показывает карту кампуса со свободными аудиториями в реальном времени' },
      { id: 'mvp',      label: 'Что входит в MVP?',

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.projects)) {
        parsed.projects.forEach(p => { p.answers = p.answers || {}; p.comments = p.comments || {}; });
        return parsed;
      }
    }
  } catch (e) { /* повреждённые данные — начинаем с демо */ }
  const s = seedState();
  saveState(s);
  return s;
}

function saveState(s) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }
  catch (e) { alert('Не удалось сохранить данные в localStorage'); }
}

// Сессия без авторизации: роль, «свой» проект участника и пройденный стартовый экран
function loadSession() {
  const def = { role: 'participant', myProjectId: null, onboarded: false };
  try { return Object.assign(def, JSON.parse(localStorage.getItem(SESSION_KEY) || '{}')); }
  catch (e) { return def; }
}

function saveSession() {
  try { localStorage.setItem(SESSION_KEY, JSON.stringify(session)); } catch (e) { /* не критично */ }
}

let state = loadState();
let session = loadSession();

const isCurator  = () => session.role === 'curator';
const getProject = id => state.projects.find(p => p.id === id);
const getModule  = id => MODULES.find(m => m.id === id);

/* =========================================================
   Прогресс и комментарии
   ========================================================= */
function moduleStatus(project, module) {
  const a = project.answers[module.id] || {};
  const filled = module.fields.filter(f => (a[f.id] || '').trim()).length;
  if (filled === 0) return 'empty';
  return filled === module.fields.length ? 'done' : 'partial';
}

function projectProgress(project) {
  const done = MODULES.filter(m => moduleStatus(project, m) === 'done').length;
  return { done, total: MODULES.length, pct: Math.round(done / MODULES.length * 100) };
}

// Текущий модуль — первый по порядку, который ещё не заполнен полностью
function currentModule(project) {
  return MODULES.find(m => moduleStatus(project, m) !== 'done') || null;
}

function remainingModules(project) {
  return MODULES.filter(m => moduleStatus(project, m) !== 'done');
}

const commentsFor  = (project, moduleId) => project.comments[moduleId] || [];
const commentCount = project => Object.values(project.comments).reduce((s, list) => s + list.length, 0);

const STATUS_LABEL = { done: '✓ Пройден', current: '● Текущий', partial: 'Частично', empty: 'Впереди' };

/* =========================================================
   Утилиты
   ========================================================= */
function esc(str) {
  return String(str ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function fmtDate(ts) {
  return new Date(ts).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
}

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.setAttribute('role', 'status');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1900);
}

function progressBar(pr) {
  return `<div class="progress" role="progressbar" aria-valuenow="${pr.pct}" aria-valuemin="0" aria-valuemax="100">
    <div style="width:${pr.pct}%"></div></div>`;
}

// Кольцевой индикатор прогресса (SVG)
function progressRing(pr) {
  const r = 52;
  const c = 2 * Math.PI * r;
  return `<div class="ring" role="img" aria-label="Прогресс: ${pr.done} из ${pr.total} модулей">
    <svg viewBox="0 0 120 120" aria-hidden="true">
      <defs><linearGradient id="ring-grad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#8b3cf7"/><stop offset="1" stop-color="#3ee89a"/>
      </linearGradient></defs>
      <circle cx="60" cy="60" r="${r}" fill="none" stroke="#2f3749" stroke-width="10"/>
      <circle class="ring-value" cx="60" cy="60" r="${r}" fill="none" stroke="url(#ring-grad)" stroke-width="10"
        stroke-linecap="round" transform="rotate(-90 60 60)" ${pr.pct ? '' : 'opacity="0"'}
        stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${(c * (1 - pr.pct / 100)).toFixed(2)}"/>
    </svg>
    <div class="ring-label"><strong>${pr.pct}%</strong><span>${pr.done} из ${pr.total}</span></div>
  </div>`;
}

// Полоса обязательного сценария: Проект → Модуль → Сохранение → One-pager (только для участника)
const JOURNEY = ['Создать или открыть проект', 'Пройти модуль', 'Сохранить ответ', 'Увидеть в one-pager'];
function journey(active) {
  if (isCurator()) return '';
  return `<ol class="journey no-print" aria-label="Сценарий">
    ${JOURNEY.map((label, i) => {
      const n = i + 1;
      const cls = n < active ? 'done' : n === active ? 'active' : '';
      return `<li class="${cls}" ${n === active ? 'aria-current="step"' : ''}>
        <span class="j-num">${n < active ? '✓' : n}</span><span>${label}</span></li>`;
    }).join('')}
  </ol>`;
}

function setCrumbs(items) {
  document.getElementById('crumbs').innerHTML = items
    .map(i => i.href ? `<a href="${i.href}">${esc(i.label)}</a>` : esc(i.label))
    .join(' &nbsp;/&nbsp; ');
}

const homeCrumb = () => isCurator()
  ? { label: 'Все команды', href: '#/curator' }
  : { label: 'Мой проект', href: '#/' };

function projectCrumbs(project, ...rest) {
  return [homeCrumb(), { label: project.name || 'Без названия', href: `#/p/${project.id}` }, ...rest];
}

function commentsBlock(project, module) {
  const list = commentsFor(project, module.id);
  if (!list.length && !isCurator()) return '';
  return `<div class="comments no-print">
    <div class="comments-title">💬 Комментарии куратора${list.length ? ` (${list.length})` : ''}</div>
    ${list.map(c => `<div class="comment"><div>${esc(c.text)}</div><div class="comment-meta">Куратор · ${fmtDate(c.at)}</div></div>`).join('')}
    ${isCurator() ? `<form class="comment-form row" data-module="${module.id}">
        <input type="text" name="text" placeholder="Комментарий команде к модулю «${esc(module.title)}»" aria-label="Комментарий">
        <button class="btn primary small" type="submit">Отправить</button>
      </form>` : ''}
  </div>`;
}

function bindCommentForms(project, rerender) {
  app.querySelectorAll('.comment-form').forEach(form => {
    form.onsubmit = e => {
      e.preventDefault();
      const text = form.elements.text.value.trim();
      if (!text) return form.elements.text.focus();
      const id = form.dataset.module;
      project.comments[id] = [...commentsFor(project, id), { text, at: Date.now() }];
      saveState(state);
      toast('Комментарий отправлен команде');
      rerender();
    };
  });
}

/* =========================================================
   One-pager: общий рендер для страницы и живого превью
   draft подменяет ответы модуля draftModuleId только при отрисовке
   ========================================================= */
function renderSheet(project, { draftModuleId = null, draft = null, savedId = null, preview = false } = {}) {
  const view = { answers: {} };
  MODULES.forEach(m => {
    view.answers[m.id] = m.id === draftModuleId && draft ? draft : (project.answers[m.id] || {});
  });
  const pr = projectProgress(view);

  const sections = MODULES.map((m, i) => {
    const st = moduleStatus(view, m);
    const a = view.answers[m.id];
    const drafting = preview && m.id === draftModuleId;
    const cls = ['op-section', savedId === m.id ? 'just-saved' : '', drafting ? 'is-drafting' : ''].join(' ').trim();
    const badges = [
      savedId === m.id ? '<span class="badge done no-print">Только что сохранено</span>' : '',
      drafting ? '<span class="badge current">✎ Сейчас заполняется</span>' : '',
      st === 'partial' ? '<span class="badge partial">Заполнен частично</span>' : '',
    ].join('');
    const body = st === 'empty'
      ? `<div class="empty-section"><strong>Пустой раздел.</strong> Модуль «${esc(m.title)}» ещё не заполнен.
          ${!preview && !isCurator() ? `<span class="no-print"><br><a href="#/p/${project.id}/m/${m.id}">Заполнить модуль →</a></span>` : ''}</div>`
      : `<dl>${m.fields.map(f => `
          <dt>${esc(f.label)}</dt>
          <dd>${(a[f.id] || '').trim() ? esc(a[f.id].trim()) : '<span class="missing">Нет ответа</span>'}</dd>`).join('')}
        </dl>`;
    return `<section ${preview ? '' : `id="section-${m.id}"`} class="${cls}">
      <div class="op-sec-head"><span class="op-num">${i + 1}</span><h3>${esc(m.title)}</h3>${badges}</div>
      ${body}
      ${preview ? '' : commentsBlock(project, m)}
    </section>`;
  }).join('');

  return `<article class="onepager sheet ${preview ? 'is-preview' : ''}">
    <header class="op-head">
      <div class="op-label">One-pager · Launch Lab 21</div>
      <div class="op-title">${project.name ? esc(project.name) : '<span class="missing">Название не указано</span>'}</div>
      <p class="op-desc">${project.description ? esc(project.description) : '<span class="missing">Описание не заполнено</span>'}</p>
      <p class="op-team"><strong>Команда:</strong> ${project.team ? esc(project.team) : '<span class="missing">не указана</span>'}</p>
      <div class="op-ready"><div class="op-ready-bar"><div style="width:${pr.pct}%"></div></div>Готовность ${pr.done} из ${pr.total}</div>
    </header>
    ${sections}
  </article>`;
}

  </div>`;
}

// 1. Страница проекта: кольцо прогресса и дорожка модулей
function viewProject(project) {
  const pr = projectProgress(project);
  const nextModule = currentModule(project);
  const remaining = remainingModules(project);
  setCrumbs([homeCrumb(), { label: project.name || 'Без названия' }]);

  app.innerHTML = `
    ${journey(2)}
    <div class="page-head row">
      <div style="min-width:0">
        <span class="eyebrow">${isCurator() ? 'Просмотр команды' : 'Проект команды'}</span>
        <h1>${esc(project.name || 'Без названия')}</h1>
        <p class="sub" style="margin:0">${project.team ? 'Команда: ' + esc(project.team) : '<span class="missing">Состав команды не указан</span>'}</p>
      </div>
      <div class="spacer"></div>
      ${isCurator()
        ? '<a class="btn" href="#/curator">← Все команды</a>'
        : `<button class="btn ghost" id="switch-team">Сменить команду</button>
           <a class="btn" href="#/p/${project.id}/profile">Профиль</a>`}
    </div>

    <div class="project-grid">
      <aside class="card progress-card">
        ${progressRing(pr)}
        <div class="pc-caption">${pr.done} из ${pr.total} модулей пройдено</div>
        <p class="remaining" id="remaining">
          ${nextModule
            ? `Текущий модуль: <strong>${esc(nextModule.title)}</strong><br>
               Осталось заполнить (${remaining.length}): ${remaining.map(m => esc(m.title)).join(', ')}`
            : 'Все модули заполнены — one-pager готов 🎉'}
        </p>
        <div class="pc-actions">
          ${nextModule && !isCurator() ? `<a class="btn primary block" href="#/p/${project.id}/m/${nextModule.id}">Продолжить: ${esc(nextModule.title)} →</a>` : ''}
          <a class="btn block ${nextModule && !isCurator() ? '' : 'primary'}" href="#/p/${project.id}/onepager">Открыть one-pager</a>
        </div>
      </aside>

      <section>
        <h2 style="margin-bottom:14px">Модули программы</h2>
        <ol class="track">
          ${MODULES.map((m, i) => {
            const st = moduleStatus(project, m);
            const view = st === 'done' ? 'done' : m === nextModule ? 'current' : st;
            const hint = view === 'current' && st === 'partial' ? ' · начат' : '';
            const cc = commentsFor(project, m.id).length;
            return `<li><a class="card module-item ${view === 'current' ? 'is-current' : ''}" href="#/p/${project.id}/m/${m.id}" data-status="${view}">
              <span class="node ${view}">${st === 'done' ? '✓' : i + 1}</span>
              <div class="mi-body">
                <div class="mi-title">${esc(m.title)}</div>
                <div class="mi-desc">${esc(m.description)}</div>
              </div>
              <div class="mi-badges">
                ${cc ? `<span class="badge current" title="Комментарии куратора">💬 ${cc}</span>` : ''}
                <span class="badge ${view}">${STATUS_LABEL[view]}${hint}</span>
              </div>
            </a></li>`;
          }).join('')}
        </ol>
      </section>
    </div>`;

  const sw = document.getElementById('switch-team');
  if (sw) sw.onclick = () => {
    session.myProjectId = null;
    saveSession();
    location.hash = '#/';
  };
}

// 2. Модуль: форма слева, живое превью one-pager справа (для куратора — только просмотр)
function viewModule(project, module) {
  const saved = project.answers[module.id] || {};
  const index = MODULES.indexOf(module);
  const readOnly = isCurator();
  const total = module.fields.length;
  const filledOf = data => module.fields.filter(f => (data[f.id] || '').trim()).length;
  const savedFilled = filledOf(saved);
  setCrumbs(projectCrumbs(project, { label: module.title }));

  app.innerHTML = `
    ${journey(2)}
    ${readOnly ? '<div class="notice">Режим куратора: ответы доступны только для просмотра. Комментарий можно оставить под формой.</div>' : ''}
    <div class="steps no-print">
      ${MODULES.map((m, i) => {
        const st = moduleStatus(project, m);
        return `<a class="step ${m === module ? 'active' : ''} ${st === 'done' ? 'done' : ''}" href="#/p/${project.id}/m/${m.id}">
          ${st === 'done' ? '✓' : i + 1}. ${esc(m.title)}</a>`;
      }).join('')}
    </div>

    <div class="split">
      <div>
        <form class="card form-card" id="module-form">
          <div class="form-head">
            <span class="eyebrow">Модуль ${index + 1} из ${MODULES.length}</span>
            <h1>${esc(module.title)}</h1>
            <p class="sub">${esc(module.description)}</p>
          </div>
          <div class="filled">
            <div class="progress"><div id="filled-bar" style="width:${Math.round(savedFilled / total * 100)}%"></div></div>
            <span id="filled-count">Заполнено ${savedFilled} из ${total}</span>
          </div>
          <div class="fields">
            ${module.fields.map((f, i) => `
              <label class="field">
                <span class="q"><span class="q-num">${i + 1}</span>${esc(f.label)}</span>
                <textarea name="${f.id}" placeholder="${esc(f.placeholder)}" ${readOnly ? 'readonly' : ''}>${esc(saved[f.id] || '')}</textarea>
              </label>`).join('')}
          </div>
          <div class="form-actions">
            <div class="row">
              ${readOnly
                ? `<a class="btn primary" href="#/p/${project.id}/onepager">Открыть one-pager →</a>`
                : '<button type="submit" class="btn primary" id="save-answer">Сохранить ответ и открыть one-pager →</button>'}
              <div class="spacer"></div>
              <a class="btn ghost" href="#/p/${project.id}">${readOnly ? 'К модулям' : 'Отмена'}</a>
            </div>
            <p class="form-error" id="form-error" hidden>Заполните хотя бы одно поле, чтобы сохранить ответ.</p>
          </div>
        </form>
        ${commentsBlock(project, module)}
      </div>

      <aside class="preview no-print" aria-label="Живое превью one-pager">
        <div class="preview-head">
          <span class="preview-title">👁 Живое превью one-pager</span>
          <div class="spacer"></div>
          <span id="draft-badge" class="badge ${savedFilled ? 'done' : 'empty'}">${savedFilled ? '✓ Сохранено' : 'Пока пусто'}</span>
        </div>
        <p class="preview-hint">${readOnly ? 'Так one-pager команды выглядит сейчас.' : 'Текст появляется здесь сразу, пока вы печатаете. В one-pager он попадёт после сохранения.'}</p>
        <div id="preview-sheet">${renderSheet(project, { draftModuleId: module.id, draft: saved, preview: true })}</div>
      </aside>
    </div>`;

  bindCommentForms(project, () => viewModule(project, module));

  const previewBox = app.querySelector('.preview');
  const sheetBox = document.getElementById('preview-sheet');
  const focusDraftSection = () => {
    if (!matchMedia('(min-width: 1001px)').matches) return;
    const sec = sheetBox.querySelector('.is-drafting');
    if (sec) previewBox.scrollTop = Math.max(0, sec.offsetTop - 90);
  };
  focusDraftSection();
  if (readOnly) return;

  const form = document.getElementById('module-form');
  const errorEl = document.getElementById('form-error');
  const badge = document.getElementById('draft-badge');
  const readDraft = () => Object.fromEntries(module.fields.map(f => [f.id, form.elements[f.id].value]));
  let dirty = false;
  isDirty = () => dirty;

  form.addEventListener('input', () => {
    if (!dirty) {
      // Шаг 2 → 3: как только начали вводить, подсвечиваем «Сохранить ответ»
      document.querySelector('.journey').outerHTML = journey(3);
      badge.className = 'badge partial';
      badge.textContent = '✎ Черновик · не сохранено';
    }
    dirty = true;
    errorEl.hidden = true;
    const draft = readDraft();
    const n = filledOf(draft);
    sheetBox.innerHTML = renderSheet(project, { draftModuleId: module.id, draft, preview: true });
    document.getElementById('filled-count').textContent = `Заполнено ${n} из ${total}`;
    document.getElementById('filled-bar').style.width = `${Math.round(n / total * 100)}%`;
    focusDraftSection();
  });

  form.onsubmit = e => {
    e.preventDefault();
    const data = readDraft();
    if (!Object.values(data).some(v => v.trim())) {
      errorEl.hidden = false;
      return;
    }
    project.answers[module.id] = data;
    project.updatedAt = Date.now();
    saveState(state);
    dirty = false;
    toast('Ответ сохранён');
    location.hash = `#/p/${project.id}/onepager/${module.id}`;
  };
}

// Профиль проекта
function viewProfile(project) {
  setCrumbs(projectCrumbs(project, { label: 'Профиль' }));
  const isNew = !Object.keys(project.answers).length;
  app.innerHTML = `
    ${journey(1)}
    <div style="max-width:720px">
      <span class="eyebrow">Шаг 1 · Профиль</span>
      <h1>Профиль проекта</h1>
      <p class="sub">Эти данные попадут в шапку one-pager.</p>
      <form class="card stack" id="profile-form">
        ${PROFILE_FIELDS.map((f, i) => `
          <label class="field">
            <span class="q"><span class="q-num">${i + 1}</span>${esc(f.label)}</span>
            ${f.type === 'textarea'
              ? `<textarea name="${f.id}" placeholder="${esc(f.placeholder)}">${esc(project[f.id])}</textarea>`
              : `<input type="text" name="${f.id}" placeholder="${esc(f.placeholder)}" value="${esc(project[f.id])}">`}
          </label>`).join('')}
        <div class="row" style="padding-top:8px">
          <button type="submit" class="btn primary">${isNew ? 'Сохранить и перейти к модулю 1 →' : 'Сохранить'}</button>
          <div class="spacer"></div>
          <a class="btn ghost" href="#/p/${project.id}">Отмена</a>
        </div>
      </form>
    </div>`;

  const form = document.getElementById('profile-form');
  let dirty = false;
  isDirty = () => dirty;
  form.addEventListener('input', () => { dirty = true; });
  form.onsubmit = e => {
    e.preventDefault();
    PROFILE_FIELDS.forEach(f => { project[f.id] = form.elements[f.id].value.trim(); });
    project.updatedAt = Date.now();
    saveState(state);
    dirty = false;
    toast('Профиль сохранён');
    location.hash = isNew ? `#/p/${project.id}/m/${MODULES[0].id}` : `#/p/${project.id}`;
  };
}

// 3. One-pager — собирается автоматически из сохранённых ответов
function viewOnePager(project, savedId) {
  const pr = projectProgress(project);
  const saved = !isCurator() && savedId ? getModule(savedId) : null;
  const nextModule = currentModule(project);
  setCrumbs(projectCrumbs(project, { label: 'One-pager' }));

  app.innerHTML = `
    ${journey(saved ? 5 : 4)}
    ${saved ? `<div class="success no-print" id="saved-banner">
      <strong>✓ Ответ сохранён.</strong> Модуль «${esc(saved.title)}» уже добавлен в one-pager ниже.
      <div class="row" style="margin-top:12px">
        ${!nextModule
          ? '<span><strong>Все модули пройдены 🎉</strong></span>'
          : nextModule === saved
            ? `<a class="btn primary" href="#/p/${project.id}/m/${saved.id}">Дозаполнить модуль «${esc(saved.title)}» →</a>`
            : `<a class="btn primary" href="#/p/${project.id}/m/${nextModule.id}">Следующий модуль: ${esc(nextModule.title)} →</a>`}
        ${nextModule !== saved ? `<a class="btn" href="#/p/${project.id}/m/${saved.id}">Изменить ответ</a>` : ''}
      </div>
    </div>` : ''}
    ${isCurator() ? '<div class="notice no-print">Режим куратора: читайте ответы команды и оставляйте комментарии под каждым модулем. Команда увидит их у себя.</div>' : ''}
    <div class="row no-print" style="margin-bottom:18px">
      ${isCurator()
        ? '<a class="btn ghost" href="#/curator">← Все команды</a>'
        : `<a class="btn ghost" href="#/p/${project.id}">← К модулям</a>`}
      <div class="spacer"></div>
      <span class="badge ${pr.done === pr.total ? 'done' : 'current'}">Готовность: ${pr.done} из ${pr.total}</span>
      <button class="btn" onclick="window.print()">🖨 Печать / PDF</button>
    </div>
    <div style="max-width:900px;margin:0 auto">
      ${renderSheet(project, { savedId: saved ? saved.id : null })}
    </div>`;

  bindCommentForms(project, () => viewOnePager(project));

  if (saved) {
    const el = document.getElementById('section-' + saved.id);
    if (el) setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'center' }), 350);
  }
}

function viewNotFound() {
  setCrumbs([homeCrumb()]);
  app.innerHTML = `<div class="card" style="max-width:620px"><h2>Страница не найдена</h2>
    <p class="sub">Проект или модуль не существует.</p><a class="btn primary" href="#/">На главную</a></div>`;
}

/* =========================================================
   Роутер (hash) и права доступа
   ========================================================= */
let isDirty = () => false;   // есть ли несохранённые изменения на текущем экране
let currentHash = location.hash;

function render() {
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  isDirty = () => false;
  currentHash = location.hash;
  window.scrollTo(0, 0);
  document.querySelectorAll('.role-switch button').forEach(b => {
    b.setAttribute('aria-pressed', String(session.onboarded && b.dataset.role === session.role));
  });

  if (parts[0] === 'start') return viewStart();
  if (!session.onboarded && (parts.length === 0 || parts[0] === 'curator')) return go('#/start');

  if (isCurator()) {
    if (parts.length === 0 || parts[0] === 'curator') return viewCurator();
  } else {
    if (parts[0] === 'curator') return go('#/');
    if (parts.length === 0) {
      const mine = getProject(session.myProjectId);
      return mine ? go(`#/p/${mine.id}`) : viewChooseProject();
    }
  }
  if (parts[0] !== 'p') return viewNotFound();

  const project = getProject(parts[1]);
  if (!project) return viewNotFound();
  if (!isCurator() && project.id !== session.myProjectId) return viewNoAccess();

  if (parts.length === 2) return viewProject(project);
  if (parts[2] === 'profile') return isCurator() ? viewProject(project) : viewProfile(project);
  if (parts[2] === 'onepager') return viewOnePager(project, parts[3]);
  if (parts[2] === 'm') {
    const module = getModule(parts[3]);
    return module ? viewModule(project, module) : viewNotFound();
  }
  viewNotFound();
}

function go(hash) {
  if (location.hash === hash) render();
  else location.hash = hash;
}

window.addEventListener('hashchange', () => {
  if (isDirty() && !confirm('Есть несохранённые изменения. Уйти без сохранения?')) {
    history.replaceState(null, '', currentHash || location.pathname);
    return;
  }
  render();
});

window.addEventListener('beforeunload', e => {
  if (isDirty()) { e.preventDefault(); e.returnValue = ''; }
});

document.querySelectorAll('.role-switch button').forEach(b => {
  b.onclick = () => {
    if (b.dataset.role === session.role && session.onboarded && !location.hash.startsWith('#/start')) return;
    if (isDirty() && !confirm('Есть несохранённые изменения. Уйти без сохранения?')) return;
    isDirty = () => false;
    session.role = b.dataset.role;
    session.onboarded = true;
    saveSession();
    go(isCurator() ? '#/curator' : '#/');
  };
});

// Синхронизация между вкладками (например, куратор и участник в соседних окнах)
window.addEventListener('storage', e => {
  if (e.key !== STORAGE_KEY || isDirty()) return;
  state = loadState();
  render();
});

render();
</script>
</body>
</html>
